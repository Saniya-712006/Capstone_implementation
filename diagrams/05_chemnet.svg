<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 600" width="1360" height="600" role="img" aria-label="ChemNet triplet attention: bond angles at one hub atom become part of its updated hidden state">
<title>ChemNet triplet attention: bond angles at one hub atom become part of its updated hidden state</title>
<rect x="0" y="0" width="1360" height="600" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
  </marker>
  <marker id="arrowkey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
  </marker>
</defs>

<text x="680.0" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">ChemNet — triplet attention for one hub atom (src/models/chemnet.py)</text>
<rect x="40" y="90" width="340" height="340" rx="10" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
<text x="210.0" y="264.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937"></text>
<line x1="210.0" y1="280.0" x2="110" y2="180" stroke="#7e22ce" stroke-width="2"/>
<line x1="210.0" y1="280.0" x2="310" y2="190" stroke="#7e22ce" stroke-width="2"/>
<path d="M 170.0,265.0 A 45,45 0 0 1 250.0,262.0" fill="none" stroke="#b45309" stroke-width="1.5"/>
<text x="210.0" y="225.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#b45309">angle BAC</text>
<circle cx="210.0" cy="280.0" r="9" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="210.0" y="264.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">A</text>
<text x="210.0" y="306.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">hub</text>
<circle cx="110" cy="180" r="9" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="110" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">B</text>
<text x="110" y="206" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">neighbour</text>
<circle cx="310" cy="190" r="9" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="310" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">C</text>
<text x="310" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280">neighbour</text>
<text x="210.0" y="452" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" font-style="italic">degree-k atom → k neighbours → k×k pairs</text>
<rect x="430" y="90" width="570" height="60" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="715.0" y="124.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">unit_dir(A→B), unit_dir(A→C) + dist(A,B)</text>
<rect x="430" y="172" width="570" height="60" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="715.0" y="206.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">cos(angle BAC) = dot(dirAB, dirAC)</text>
<line x1="715.0" y1="150" x2="715.0" y2="172" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="430" y="254" width="570" height="60" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="715.0" y="288.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">concat[ hv_B | dist | hv_A | hv_C | angle ]</text>
<line x1="715.0" y1="232" x2="715.0" y2="254" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="430" y="336" width="570" height="60" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="715.0" y="370.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">message_mlp  →  pair_msg [k×k, 200]</text>
<line x1="715.0" y1="314" x2="715.0" y2="336" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="430" y="418" width="570" height="60" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="715.0" y="444.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">edge-attn weight × max-pool over k×k pairs  →  mv[A]</text>
<text x="715.0" y="460.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">KEY: this is the aggregation, not a simple sum</text>
<line x1="715.0" y1="396" x2="715.0" y2="418" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowkey)"/>
<rect x="430" y="500" width="570" height="60" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="715.0" y="534.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">GRU(mv[A], hv[A])  →  hv_new[A]</text>
<line x1="715.0" y1="478" x2="715.0" y2="500" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="680.0" y="586" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" font-style="italic">Grouped by source atom (not a global [2E,2E] tensor) — every atom's k~4 bonds cost O(k^2), so the whole batch costs O(E·k^2), not O(E^2).</text>
</svg>
