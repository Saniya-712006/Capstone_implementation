<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 420" width="1300" height="420" role="img" aria-label="Initializer: atom features become the learned momentum p, while position q is copied directly from the real conformer">
<title>Initializer: atom features become the learned momentum p, while position q is copied directly from the real conformer</title>
