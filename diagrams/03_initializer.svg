<text x="610.0" y="346.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#b45309">no learning on this path — q starts from real geometry</text>
<text x="650.0" y="406" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" font-style="italic">p ("which way would this atom tend to move") is learned; q ("where the atom actually is") is not — PhysNet must start from real geometry, not a guess.</text>
</svg>
