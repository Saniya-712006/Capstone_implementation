<text x="680.0" y="766" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" font-style="italic">The shuffle+detach step (amber) is the backdoor adjustment: it forces o_pred to stay accurate even when the scaffold is swapped for a random one from the batch.</text>
