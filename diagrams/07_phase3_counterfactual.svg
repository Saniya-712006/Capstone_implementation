<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 520" width="1500" height="520" role="img" aria-label="Phase-3 counterfactual explainer: cheap CPU filtering happens before any expensive GPU scoring">
<title>Phase-3 counterfactual explainer: cheap CPU filtering happens before any expensive GPU scoring</title>
<rect x="0" y="0" width="1500" height="520" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
  </marker>
  <marker id="arrowkey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
  </marker>
</defs>

<text x="750.0" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Phase-3 Counterfactual Explainer (src/explain/counterfactual.py)</text>
<rect x="40" y="80" width="200" height="55" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
<text x="140.0" y="111.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">query SMILES</text>
<rect x="40" y="165" width="200" height="60" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="140.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">predict_with_attention()</text>
<text x="140.0" y="207.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">1 model call</text>
<line x1="140.0" y1="135" x2="140.0" y2="165" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="255" width="200" height="60" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
<text x="140.0" y="281.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">causal_atoms</text>
<text x="140.0" y="297.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">{i : att_o[i] > θ}</text>
<line x1="140.0" y1="225" x2="140.0" y2="255" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="80" width="220" height="55" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
<text x="410.0" y="103.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">STONED mutate × 500</text>
<text x="410.0" y="119.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">selfies token edits</text>
<line x1="240" y1="107" x2="300" y2="107" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="570" y="80" width="220" height="55" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="680.0" y="103.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">MCS filter vs causal_atoms</text>
<text x="680.0" y="119.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">RDKit, 2D only</text>
<line x1="520" y1="107" x2="570" y2="107" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="240,285 680.0,285 680.0,135" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowkey)"/>
<line x1="850" y1="60" x2="850" y2="480" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="840" y="55" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" font-style="italic">CPU only, no model calls</text>
<text x="860" y="55" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7280" font-style="italic">GPU model calls</text>
<rect x="880" y="80" width="300" height="70" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="1030.0" y="104.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">survivors (~200)</text>
<text x="1030.0" y="120.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">3D embed + batched predict_smiles()</text>
<text x="1030.0" y="133.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">ONE model call, not 200</text>
<line x1="790" y1="107" x2="880" y2="115" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="890" y="190" width="260" height="55" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
<text x="1020.0" y="221.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">Tanimoto sim + split by Δpred (up/down)</text>
<line x1="1030.0" y1="150" x2="1020.0" y2="190" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="890" y="285" width="260" height="55" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
<text x="1020.0" y="308.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">DBSCAN cluster (eps=0.15)</text>
<text x="1020.0" y="324.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">→ top-2 diverse per direction</text>
<line x1="1020.0" y1="245" x2="1020.0" y2="285" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="890" y="380" width="260" height="60" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
<text x="1020.0" y="414.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">counterfactuals[] + alignment_score</text>
<line x1="1020.0" y1="340" x2="1020.0" y2="380" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="750.0" y="506" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" font-style="italic">The MCS filter runs before 3D embedding, on the left of the CPU/GPU boundary — so the ~60% of candidates that fail it never pay the embed+model cost.</text>
</svg>
