<rect x="250" y="230" width="300" height="60" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="400.0" y="256.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">batch_graphs()</text>
<text x="400.0" y="272.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">concat, offset begin_idx/end_idx by cumulative atom count</text>
<line x1="400.0" y1="290" x2="400.0" y2="340" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="100" y="340" width="480" height="70" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
<text x="340.0" y="371.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">Flat batch (A=60 atoms total)</text>
<text x="340.0" y="387.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">mol2 begin_idx += 20    mol3 begin_idx += 38</text>
<text x="885.0" y="74" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">vertex_edge_w1 [A,E] — block-diagonal</text>
