<text x="987.0" y="339.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">22x22</text>
<polyline points="580,375 720,375 720,225.0 750,225.0" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowkey)"/>
<text x="725.0" y="219.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#b45309">same offsets build every mask</text>
<text x="885.0" y="395" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" font-style="italic">off-diagonal blocks are always 0 —</text>
<text x="885.0" y="412" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" font-style="italic">a bond in mol 2 can never attend into mol 3</text>
<text x="650.0" y="606" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" font-style="italic">Every mask/index tensor (MaskMatrices, edge_index, batch) is built from this same offset, so they stay consistent by construction.</text>
