<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 640" width="1360" height="640" role="img" aria-label="PhysNet: learned bond-spring and chunked relational forces combine into a Newtonian position update">
<title>PhysNet: learned bond-spring and chunked relational forces combine into a Newtonian position update</title>
<rect x="0" y="0" width="1360" height="640" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
  </marker>
  <marker id="arrowkey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
  </marker>
</defs>

<text x="680.0" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">PhysNet — one Newton step (src/models/physnet.py)</text>
<rect x="40" y="50" width="20" height="20" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
<text x="50.0" y="64.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937"></text>
<text x="66" y="65" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">force computation</text>
<rect x="212.2" y="50" width="20" height="20" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="222.2" y="64.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937"></text>
<text x="238.2" y="65" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#374151">the O(A^2)→O(chunk x A) fix</text>
<rect x="40" y="100" width="560" height="200" rx="10" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="3,4"/>
<text x="50" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c2410c">Bond force</text>
<rect x="70" y="130" width="220" height="55" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
<text x="180.0" y="161.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">hv[begin], hv[end], he</text>
<rect x="330" y="130" width="240" height="55" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
<text x="450.0" y="153.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">BondForceMLP</text>
<text x="450.0" y="169.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">final layer zero-init</text>
<rect x="170" y="220" width="340" height="55" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
<text x="340.0" y="243.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">magnitude · unit_dir(q)</text>
<text x="340.0" y="259.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">→ index_add_ by begin_idx → f_bond[A,3]</text>
<line x1="290" y1="157" x2="330" y2="157" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="450.0" y1="185" x2="420.0" y2="220" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="640" y="100" width="680" height="200" rx="10" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3,4"/>
<text x="650" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">Relational force — CHUNKED</text>
<rect x="660" y="130" width="170" height="32" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="745.0" y="150.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">chunk 1 [32,A]</text>
<rect x="660" y="168" width="170" height="32" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="745.0" y="188.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">chunk 2 [32,A]</text>
<rect x="660" y="206" width="170" height="32" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="745.0" y="226.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">... chunk n</text>
<rect x="880" y="150" width="260" height="60" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="1010.0" y="176.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">RelationalForceMLP</text>
<text x="1010.0" y="192.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">per chunk — never materialises full [A,A]</text>
<line x1="830" y1="165" x2="880" y2="180" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1180" y="150" width="120" height="60" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text x="1240.0" y="176.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">f_rela[A,3]</text>
<text x="1240.0" y="192.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">Σ over A</text>
<line x1="1140" y1="180" x2="1180" y2="180" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560" y="340" width="260" height="55" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
<text x="690.0" y="371.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">f_total = f_bond + f_rela</text>
<polyline points="420.0,275 420.0,367 560,367" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="1240.0,210 1240.0,367 820,367" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="480" y="430" width="420" height="70" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
<text x="690.0" y="461.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">Newton update</text>
<text x="690.0" y="477.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">p += f_total·τ    q += (p/m)·τ    (τ=0.25)</text>
<line x1="690.0" y1="395" x2="690.0" y2="430" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="480" y="550" width="420" height="55" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
<text x="690.0" y="573.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">snapshot q → conformations[]</text>
<text x="690.0" y="589.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">used later by conf_loss</text>
<line x1="690.0" y1="500" x2="690.0" y2="550" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="940" y="465" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" font-style="italic">loop × N_ITERATION=2</text>
<text x="940" y="480" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" font-style="italic">per PhysNet call</text>
<text x="680.0" y="626" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" font-style="italic">The chunked relational force (amber) is the memory fix from report Table 3: peak tensor drops from [A,A,feat] to [32,A,feat], ~20x smaller.</text>
</svg>
